<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
  <defs>
    <clipPath id="avatarClip">
      <circle cx="50" cy="50" r="48" />
    </clipPath>
  </defs>
  <!-- Border ring -->
  <circle cx="50" cy="50" r="49" fill="#0284c7" stroke="#0f172a" stroke-width="2" />
  <!-- Personal Portrait Image -->
  <image href="profile.png" xlink:href="profile.png" x="2" y="2" width="96" height="96" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)" />
</svg>
