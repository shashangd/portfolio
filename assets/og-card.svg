<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <pattern id="dotgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#d3cbbe" />
    </pattern>
    <filter id="roughpaper">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" result="noise" numOctaves="4" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#fdfbf7" />
  <rect width="1200" height="630" fill="url(#dotgrid)" />

  <!-- Outer doodle border -->
  <rect x="25" y="25" width="1150" height="580" rx="16" fill="none" stroke="#181d26" stroke-width="4" stroke-dasharray="8 6" />

  <!-- Washi Tape -->
  <rect x="180" y="15" width="160" height="26" fill="#fbcfe8" opacity="0.9" transform="rotate(-1.5 260 28)" />
  <rect x="880" y="18" width="140" height="24" fill="#bae6fd" opacity="0.9" transform="rotate(2 950 30)" />

  <!-- Main Card -->
  <g transform="translate(60, 60)">
    <rect width="1080" height="510" rx="20" fill="#ffffff" stroke="#181d26" stroke-width="3" />
    
    <!-- Left Content -->
    <g transform="translate(60, 70)">
      <!-- Badge -->
      <rect x="0" y="0" width="360" height="34" rx="17" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
      <text x="180" y="22" font-family="'Space Grotesk', system-ui, sans-serif" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle" letter-spacing="1">
        AIRPORT IT • DIGITAL TRANSFORMATION
      </text>

      <!-- Name -->
      <text x="0" y="105" font-family="'Space Grotesk', system-ui, sans-serif" font-size="52" font-weight="800" fill="#0f172a" letter-spacing="-1">
        Shashang Dhoriyani
      </text>

      <!-- Headline -->
      <text x="0" y="150" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="700" fill="#0284c7">
        Aviation Technology &amp; Digital Transformation
      </text>

      <!-- Organization -->
      <text x="0" y="195" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="600" fill="#475569">
        Assistant Manager – Information Technology
      </text>
      <text x="0" y="225" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="500" fill="#64748b">
        Ahmedabad International Airport Limited
      </text>

      <!-- Positioning Statement -->
      <text x="0" y="280" font-family="'Caveat', cursive, sans-serif" font-size="28" font-weight="700" fill="#0369a1">
        “Bridging Code, Terminals &amp; Balance Sheets”
      </text>

      <!-- Domain Pills -->
      <g transform="translate(0, 320)">
        <rect x="0" y="0" width="130" height="32" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
        <text x="65" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">APOC Systems</text>

        <rect x="145" y="0" width="145" height="32" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
        <text x="217" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">AI Video Analytics</text>

        <rect x="305" y="0" width="155" height="32" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
        <text x="382" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">DigiYatra Biometrics</text>

        <rect x="475" y="0" width="140" height="32" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" />
        <text x="545" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">SAP IT Finance</text>
      </g>

      <!-- URL Badge -->
      <g transform="translate(0, 380)">
        <text x="0" y="16" font-family="'Space Grotesk', system-ui, sans-serif" font-size="18" font-weight="800" fill="#0284c7">
          https://shashang.me
        </text>
      </g>
    </g>

    <!-- Right: Airport Radar Visual Graphic -->
    <g transform="translate(760, 60)">
      <circle cx="160" cy="180" r="140" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3" />
      <circle cx="160" cy="180" r="105" fill="none" stroke="#bae6fd" stroke-width="2" stroke-dasharray="6 6" />
      <circle cx="160" cy="180" r="70" fill="none" stroke="#38bdf8" stroke-width="2" />
      <circle cx="160" cy="180" r="35" fill="none" stroke="#0284c7" stroke-width="1.5" />
      <circle cx="160" cy="180" r="8" fill="#0284c7" />

      <!-- Crosshairs -->
      <line x1="160" y1="40" x2="160" y2="320" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />
      <line x1="20" y1="180" x2="300" y2="180" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />

      <!-- Sweep Hand -->
      <line x1="160" y1="180" x2="275" y2="90" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
      <polygon points="160,180 275,90 285,130" fill="rgba(2, 132, 199, 0.2)" />

      <!-- Airplanes -->
      <g transform="translate(210, 110) rotate(35) scale(1.1)">
        <path d="M12 2L9 9H3L5 13H9L7 20L10 22L13 14L19 14L21 12L13 10L12 2Z" fill="#0369a1" stroke="#082f49" stroke-width="1"/>
      </g>
      <g transform="translate(100, 240) rotate(-45) scale(0.9)">
        <path d="M12 2L9 9H3L5 13H9L7 20L10 22L13 14L19 14L21 12L13 10L12 2Z" fill="#f59e0b" stroke="#78350f" stroke-width="1"/>
      </g>

      <!-- Badge -->
      <rect x="80" y="340" width="160" height="30" rx="15" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
      <text x="160" y="360" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="middle">
        LIVE OPS RADAR
      </text>
    </g>

  </g>
</svg>
